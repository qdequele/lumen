name: model-watch

# Model release watcher: diffs public model catalogs (models.dev, LiteLLM,
# OpenRouter) against scripts/model-watch/snapshot.json, files one issue per
# new provider plus a rolling issue for new models on supported providers,
# then commits the refreshed snapshot. See docs/operations/model-watch.md.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issues it would file; file nothing, commit nothing"
        type: boolean
        default: false
      max_new_issues:
        description: "Abort if a run would open more issues than this"
        type: number
        default: 10
  # On a PR touching the watcher: unit tests plus a live dry run, so the
  # change is exercised against today's catalogs before it lands.
  pull_request:
    paths:
      - "scripts/model-watch/**"
      - ".github/workflows/model-watch.yml"

permissions:
  contents: read

# Never run two watchers at once: both would diff the same snapshot and file
# the same issues.
concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  check:
    name: tests · live dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/model-watch -v

      - name: Dry run against the live catalogs
        run: python3 scripts/model-watch/model_watch.py --dry-run

  watch:
    name: watch catalogs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed snapshot
      issues: write # open / comment on watcher issues
    steps:
      - uses: actions/checkout@v7

      - name: Diff catalogs and file issues
        id: watch
        # A failing source still lets the healthy ones be filed and recorded;
        # the last step turns the run red so the failure is noticed.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          MAX_NEW_ISSUES: ${{ inputs.max_new_issues || 10 }}
        run: python3 scripts/model-watch/model_watch.py $DRY_RUN --max-new-issues "$MAX_NEW_ISSUES"

      - name: Commit refreshed snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          git add scripts/model-watch/snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(model-watch): refresh catalog snapshot"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push the refreshed snapshot." >&2
          exit 1

      - name: Fail if the watcher step failed
        if: steps.watch.outcome == 'failure'
        run: |
          echo "::error::The watcher step failed (a source changed shape or was unreachable, or the issue guard tripped). See its log." >&2
          exit 1
