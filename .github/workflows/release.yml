name: Release

# Cut a release on a semver tag: static musl binaries (x86_64 + aarch64) attached
# to the GitHub Release, and a multi-arch distroless image pushed to GHCR (M7 §7.2).
#
# Order of operations: the full test gate must pass on the tagged commit first;
# then the GitHub Release is created as a DRAFT with notes extracted from
# CHANGELOG.md; binaries (with .sha256 checksums) attach to the draft; the
# release is published only once every asset is attached. Draft-first is
# mandatory: with immutable releases, GitHub rejects any asset upload after
# publication, so publish must be the last step, never the first.
#
# The image depends on the test gate only and pushes the version tag only, so
# a release-notes or binaries problem can never cost the image again. The
# `latest` image tag moves in the final `latest` job, once the release is
# published (or when a re-run finds it already published). A re-run on a tag
# whose release is already published does not fail: it leaves the immutable
# release alone and only (re)pushes the image.
on:
  push:
    tags:
      - "v*"
  # release-on-merge.yml calls this workflow right after it pushes the tag of a
  # merged `chore(release): vX.Y.Z` PR: a tag pushed with the default
  # GITHUB_TOKEN does not trigger `push` workflows, so the call replaces it.
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to release (already pushed)"
        type: string
        required: true

permissions:
  contents: write # attach binaries to the release
  packages: write # push the image to GHCR

env:
  # The tag being released: the pushed tag, or the caller's input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Tagging a commit must not ship it untested: the same gate as ci.yml runs
  # on the tagged commit before anything is built or published.
  gate:
    name: test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (pedantic, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # Create the release as a DRAFT up front with its notes, so the binaries
  # jobs attach to a release that already has a curated body instead of an
  # empty one. It stays a draft (mutable, invisible to users) until the
  # `publish` job flips it once every asset is attached.
  release-notes:
    name: create draft release with CHANGELOG notes
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract this version's CHANGELOG section
        run: |
          # RELEASE_TAG, not GITHUB_REF_NAME: under workflow_call the ref is the PR merge ref.
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! [ -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$version]\" section; refusing to cut a release with empty notes." >&2
            exit 1
          fi
          echo "extracted $(wc -l < RELEASE_NOTES.md) lines of release notes"

      # A re-run on a tag whose release is already published must not fail
      # the whole workflow (that is how the v0.5.0 image push was lost): the
      # published release is immutable, so it is left alone and only the
      # image jobs run.
      - name: Detect an already-published release
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only a confirmed "release not found" means a fresh tag. Any other
        # lookup failure (API outage, auth) fails the step: treating it as
        # "not published" would rewrite the notes of an immutable release and
        # then fail on the asset upload, far from the real error.
        run: |
          if view="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>&1)"; then
            if [ "$view" = "false" ]; then
              echo "::notice::release $RELEASE_TAG is already published; skipping notes and binaries, pushing the image only"
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
          elif printf '%s\n' "$view" | grep -qi 'release not found'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not look up release $RELEASE_TAG: $view" >&2
            exit 1
          fi

      - name: Create or update the draft release
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md 2>/dev/null \
            || gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md

  binaries:
    name: static binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: release-notes
    if: needs.release-notes.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `cross` gives a musl-capable linker for both targets without host setup.
      - name: Install cross
        run: cargo install cross --locked

      - name: Build release binary
        run: cross build --release --bin lumen --target ${{ matrix.target }}

      - name: Package and checksum
        run: |
          bin="target/${{ matrix.target }}/release/lumen"
          size=$(stat -c%s "$bin")
          echo "binary size: $size bytes"
          # Fail the release if the stripped binary blows past the 25 MB budget.
          test "$size" -lt 26214400 || { echo "binary exceeds 25 MB"; exit 1; }
          tar -czf "lumen-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" lumen
          sha256sum "lumen-${{ matrix.target }}.tar.gz" > "lumen-${{ matrix.target }}.tar.gz.sha256"

      # `gh release upload` resolves draft releases by tag; --clobber keeps
      # re-runs idempotent while the release is still a draft.
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "lumen-${{ matrix.target }}.tar.gz" \
            "lumen-${{ matrix.target }}.tar.gz.sha256"

  # The image needs only the test gate: a release-notes problem must never
  # cost the image again. Only the version tag is pushed here; `latest`
  # moves in the last job, after the release is published.
  image:
    name: multi-arch image to GHCR
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}

  # Publish LAST, once every binary is attached and the image is pushed. From
  # this moment the release is immutable: no asset can be added or changed.
  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [release-notes, binaries, image]
    if: needs.release-notes.outputs.published != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 assets (2 tarballs + 2 checksums), found $count; leaving the release as a draft." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest

  # `latest` points at a published release only: after `publish` succeeded,
  # or when the release was already published and the image has just been
  # (re)pushed. A failed publish leaves `latest` where it was.
  latest:
    name: move the latest image tag
    runs-on: ubuntu-latest
    needs: [release-notes, image, publish]
    if: always() && needs.image.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release-notes.outputs.published == 'true'))
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the version image as latest
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/$GITHUB_REPOSITORY:latest" \
            "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG"

  # Tell the Lab (meilisearch/lab) a release is out, so its contracts
  # workflow re-vendors docs/openapi.yaml right away instead of at its daily
  # run. Optional: it needs LAB_DISPATCH_TOKEN (a fine-grained token with
  # Contents read and write on meilisearch/lab, which repository_dispatch
  # requires); without it the job skips with a notice and the Lab still
  # catches up on its daily schedule. A failed dispatch never fails a release
  # that is already published.
  notify-lab:
    name: notify the Lab
    runs-on: ubuntu-latest
    needs: [release-notes, publish]
    if: always() && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release-notes.outputs.published == 'true'))
    permissions: {}
    steps:
      - name: Send repository_dispatch lumen-released to meilisearch/lab
        env:
          LAB_DISPATCH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$LAB_DISPATCH_TOKEN" ]; then
            echo "::notice::LAB_DISPATCH_TOKEN is not set; skipping the Lab notification (its daily contracts run will pick up $RELEASE_TAG)"
            exit 0
          fi
          payload=$(printf '{"event_type":"lumen-released","client_payload":{"tag":"%s","version":"%s"}}' "$RELEASE_TAG" "${RELEASE_TAG#v}")
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LAB_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/meilisearch/lab/dispatches -d "$payload" || true)
          if [ "$code" = "204" ]; then
            echo "notified meilisearch/lab of $RELEASE_TAG"
          else
            echo "::warning::could not notify meilisearch/lab (HTTP ${code:-none}): $(head -c 300 /tmp/dispatch.out 2>/dev/null)"
          fi
