# cargo-deny configuration (M7 §7.4): advisories + license policy.
# Run locally with `cargo deny check`.

[advisories]
version = 2
# A yanked *transitive* crate we can't control (spin 0.9.8 via sqlx → flume) is
# a warning, not a hard failure; direct deps are still reviewed.
yanked = "warn"
# Advisories consciously accepted, each transitive and not exploitable here:
ignore = [
    # `rsa` Marvin timing side-channel; no patched release exists. `rsa` is
    # compiled in through jsonwebtoken's `rust_crypto` backend for the Vertex AI
    # RS256 service-account assertion. LUMEN never decrypts with RSA, and it only
    # signs a JWT it builds itself (no attacker-chosen input), about once per
    # token lifetime, sent only to Google's token endpoint: there is no remote
    # timing oracle. Re-checked 2026-10-31.
    "RUSTSEC-2023-0071",
    # `crypto-bigint` 0.5 non-constant-time ops (fixed only in 0.7.6, a
    # semver-incompatible jump). Pulled in by elliptic-curve 0.13 via p256/p384,
    # which jsonwebtoken 11.1.0 (latest as of 2026-10-31) compiles in for
    # ES256/ES384. LUMEN only uses `EncodingKey::from_rsa_pem` + RS256
    # (crates/providers/src/google/vertex/auth.rs), so no EC code runs. Drop
    # this once jsonwebtoken moves to elliptic-curve 0.14. Added 2026-10-31.
    "RUSTSEC-2026-0387",
    # `unsafe-libyaml` unmaintained (archived, no patched release), via
    # serde_yaml_ng. It only parses docs/openapi.yaml, compiled in with
    # `include_str!` (crates/server/src/openapi.rs): repo-owned input, never
    # runtime or client YAML. Replace serde_yaml_ng with a maintained parser to
    # drop this. Added 2026-10-31.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
# Permissive licenses only - LUMEN ships as a single self-hostable binary,
# so no copyleft that would impose obligations on operators.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # CC0-1.0 is a public-domain dedication (notify → file-watch): no obligations
    # on operators, strictly more permissive than MIT. Fits the policy below.
    "CC0-1.0",
    # MIT-0 is MIT without the attribution clause (borrow-or-share via jsonschema dev-dep), strictly more permissive.
    "MIT-0",
]
# A dependency whose license can't be determined is a review item, not a silent pass.
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat the binary but aren't fatal; surface them.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io - no git or unknown registries slip in unaudited.
unknown-registry = "deny"
unknown-git = "deny"
