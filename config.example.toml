# LUMEN example configuration.
#
# Copy to `config.toml` and adjust. Every value can also be overridden with an
# environment variable prefixed `LUMEN_`, using `__` for nesting, e.g.:
#   LUMEN_SERVER__PORT=9090
#   LUMEN_LOG_FORMAT=json
#
# SECURITY: API keys are NEVER written here. Each provider references the *name*
# of an environment variable that holds its key (`api_key_env`). LUMEN reads
# that variable at startup-time only when the provider is actually used.

# Log format: "pretty" (human-readable, default) or "json" (production).
# NOTE: top-level keys must appear BEFORE any [table] header in TOML.
log_format = "pretty"

# ---------------------------------------------------------------------------
# Where the DYNAMIC half of this config lives (ADR 012) - everything below
# except the restart-only boot layer: [server], log_format, [telemetry], and
# [auth] enabled/db_path/usage_channel_capacity/usage_batch_max/
# usage_flush_ms. Restart-only: like
# every other boot-layer key, changing this needs a restart, never a reload.
#
#   "file" (default) - this file IS the dynamic document. PUT /admin/config
#                       and the granular /admin/config/* routes stage a new
#                       copy, back up the previous one to <this file>.bak,
#                       and rename atomically; an external edit (a human, a
#                       GitOps sync) is picked up by the file watcher.
#   "db"              - the dynamic document lives in the config_versions
#                       table of the auth database instead. Requires
#                       auth.enabled = true. When this is "db", THIS FILE MAY
#                       CONTAIN ONLY the boot layer listed above and this
#                       config_source key itself - any other key (a
#                       [[providers]] block, [resilience],
#                       auth.flush_interval_ms, ...) is a boot
#                       error naming the offending key, never a silent second
#                       source. A fresh db-mode deployment with nothing ever
#                       written boots into an empty-but-valid config (no
#                       providers) and logs that a PUT /admin/config is
#                       expected - a pure API-driven bootstrap.
#
# Both modes expose the identical admin API (GET/PUT /admin/config, plus the
# granular GET/PUT/DELETE /admin/config/providers/{name} and
# GET/PUT /admin/config/{section} routes), so a client cannot tell which one
# it is talking to. See docs/operations/config-modes.md for the full mode
# reference, the endpoint table, the If-Match/boot-layer-guard flow, and the
# file<->db migration procedures.
# ---------------------------------------------------------------------------
config_source = "file"

# ---------------------------------------------------------------------------
# HTTP server
# ---------------------------------------------------------------------------
[server]
host = "127.0.0.1"        # bind address; use "0.0.0.0" in a container
port = 8080               # must not be 0
body_limit = 10485760     # max request body in bytes (10 MiB)

# How long to wait for the upstream's first sign of life before failing with
# LM-3011 (504). Streaming: time to the first SSE frame. Non-streaming: the
# whole upstream call (per-phase timeouts land later) - raise this if you run
# long non-streaming generations.
first_token_timeout_ms = 30000

# Idle interval after which a `: ping` SSE comment keeps proxies from reaping
# a silent stream.
sse_heartbeat_ms = 15000

# ---------------------------------------------------------------------------
# Auth: virtual keys, hard budgets, quotas, usage log. Disabled by
# default - the gateway is then an open proxy with no database at all.
#
# When enabled, the LUMEN_MASTER_KEY env var is REQUIRED (64 hex chars =
# 32 bytes). It is both the bearer token of the /admin API and the AES-256-GCM
# key sealing provider keys stored at rest. Never logged, never stored.
#
# Enforcement is in memory on the request path (the DB is never consulted per
# request): budget checks are an atomic reservation of the pre-call estimate,
# settled to the real usage after the call. Refusals: 402 LM-4001 (budget),
# 429 LM-4002 (RPM), 429 LM-4003 (TPM) - always BEFORE the upstream call.
# ---------------------------------------------------------------------------
[auth]
enabled = false
db_path = "lumen.db"          # SQLite file, created if missing
flush_interval_ms = 10000         # memory→DB budget flush; a crash loses at
                                  # most this much ACCOUNTING, never allows an
                                  # overrun (enforcement is in memory)
usage_channel_capacity = 10000    # bounded log channel; full = drop + counter
usage_batch_max = 500             # write a batch at this many entries…
usage_flush_ms = 2000             # …or at least this often
                                  # (these three are restart-only: the channel
                                  # is sized once at startup)
retention_days = 30               # purge usage_log rows older than this

# ---------------------------------------------------------------------------
# Outbound budget webhooks (ADR 011) - ABSENT by default.
#
# This whole section is commented out on purpose. With no [webhooks] block the
# gateway makes no outbound call to anything but its configured providers.
# Uncommenting it makes LUMEN POST to the URL below: that is a deliberate
# choice, not a default.
#
# What it is for: a billing control plane that sells prepaid credit needs to
# hear that a budget is nearly gone BEFORE it hits zero, because a hard budget
# refuses with 402 LM-4001 the moment the pool empties. A `budget.threshold`
# event at 80% is the trigger for a Stripe-style auto-recharge, which lands as
# a POST /admin/keys/{id}/grant before the customer ever sees a refusal.
#
# What it sends: accounting facts only - event id and kind, the key or group id
# and name, budget_max, budget_spent, the crossed threshold, a timestamp. Never
# a plaintext key, never client metadata, never prompt or response content.
#
# Requires auth.enabled = true (every event describes a virtual key or a budget
# group); LUMEN refuses to boot otherwise.
#
# Detection costs nothing on the request path: it is a compare against the
# armed thresholds on the atomic budget settle that already happens per
# request. Delivery goes through a bounded queue drained by a background task -
# a full queue DROPS events and counts them in lumen_webhook_dropped_total
# rather than slowing a request down. Webhooks are a signal, not an accounting
# system: GET /admin/usage/export stays the source of truth, and a receiver
# must reconcile against it.
#
# Each POST carries:
#   x-lumen-signature   hex HMAC-SHA256 of the exact request body
#   x-lumen-event-id    unique per EVENT, not per attempt - dedupe on it
#   x-lumen-event       the event kind, for routing without parsing
#   x-lumen-timestamp   the event's own `ts` (also inside the signed body)
#
# Delivery is at-least-once while the process lives: retries reuse the same
# event id, and a crash can re-fire an event after a restart (up to
# auth.flush_interval_ms of accounting can be lost). Receivers MUST be
# idempotent on x-lumen-event-id.
#
# You do not have to use this file at all. The admin API manages the same
# settings at runtime, which is what a billing control plane wants:
#
#   GET    /admin/webhooks               current settings, source, signed state
#   PUT    /admin/webhooks               replace every setting, applied now
#   DELETE /admin/webhooks               stop emitting, persistently
#   PUT    /admin/webhooks/signing-key   store the secret, sealed at rest
#   DELETE /admin/webhooks/signing-key   forget it
#
# Settings written through the API are stored in the auth database and WIN over
# this block, so a runtime change is not undone by the next reload; GET reports
# `source` as "database" or "config" so the two are never ambiguous. A DELETE is
# stored too, so it cannot be quietly re-enabled by this block either. If you
# manage this file, do not PUT; if you manage the API, this block is just the
# boot-time default. See docs/operations/keys-budgets.md.
#
# A reload re-applies every field of whichever source is in force. The only
# thing it cannot do is see a NEW environment variable: a running process
# cannot observe a change to its own environment, so pointing signing_key_env
# at a variable that was unset at startup needs a restart (or the sealed-secret
# route above, which needs no variable at all).
# ---------------------------------------------------------------------------
# [webhooks]
# url = "https://backend.example.com/lumen/events"
#
# # Name of the env var holding the HMAC-SHA256 signing secret - never the
# # secret itself, exactly like api_key_env. Named but unset/empty with no
# # secret stored through PUT /admin/webhooks/signing-key is a boot error;
# # omitting it entirely (and storing nothing) means UNSIGNED deliveries, only
# # defensible on a trusted network, and logs a startup warning.
# #
# # The environment wins when the variable is set and non-empty; the sealed
# # secret fills in otherwise. A control plane that does not own this host's
# # environment should skip this field and use the signing-key route.
# signing_key_env = "LUMEN_WEBHOOK_SECRET"
#
# # Which events to deliver. Default: ["budget.threshold", "budget.exhausted"].
# #   budget.threshold  - spend crossed a configured percentage of the cap
# #   budget.exhausted  - the first LM-4001 refusal since the subject last had
# #                       headroom
# #   key.disabled      - a PATCH disabled a key (edge-triggered)
# #   key.rotated       - a key's secret was rotated (id and budget preserved)
# #   key.deleted       - a key was soft-deleted and stops authenticating
# events = ["budget.threshold", "budget.exhausted", "key.disabled"]
#
# # Percent-of-budget thresholds, each fired ONCE per budget epoch - not once
# # per request past it. A grant that buys headroom re-arms the thresholds it
# # drops below, so the next epoch signals again.
# thresholds = [50, 80, 95]
#
# channel_capacity = 1024   # bounded queue; full = drop + counter, never
#                           # backpressure. Editable at runtime: the queue is
#                           # rebuilt and the previous sender drains its backlog.
# timeout_ms = 5000         # per-attempt request timeout
# max_attempts = 5          # total attempts per event, including the first
# retry_base_ms = 500       # pre-jitter backoff after the first failure, doubling

# ---------------------------------------------------------------------------
# Telemetry (ADR 002).
#
# Clients may send an `x-lumen-metadata` header (alias: `cf-aig-metadata`)
# with a FLAT JSON object (≤ 16 keys, key ≤ 64 B, value ≤ 256 B, header ≤ 4 KiB)
# of string/number/bool values. The full object is attached to structured logs
# and the usage_log `metadata` column. It is opaque - never inspected - but it
# IS logged: do not put secrets or prompt content in it.
#
# ONLY the keys listed here become Prometheus labels on the token counters;
# everything else stays logs-only. Empty (the default) = client metadata can
# never create a single new time series. Cardinality is your decision.
# Restart-only: the label set is fixed when the metrics are registered.
# ---------------------------------------------------------------------------
[telemetry]
metadata_labels = []              # e.g. ["team", "env"]

# ---------------------------------------------------------------------------
# Token estimation strategy (ADR 003) - OPTIONAL, defaults to "heuristic".
#
# Token counts are a first-class output of every request. When an upstream
# reports usage, that authoritative count always wins (estimated = false).
# When it does NOT (e.g. TEI embeddings, some streams), LUMEN estimates
# locally and flags the count `estimated = true`. This knob picks the estimator:
#
#   "heuristic" (default) - a cheap ~4-bytes-per-token byte count. Zero added
#                           latency, allocation-light, always hot-path-safe.
#   "accurate"            - exact per-model BPE (tiktoken) for OpenAI-family
#                           models: cl100k_base for gpt-4 / gpt-3.5 /
#                           text-embedding-3, o200k_base for gpt-4o / o1 / o3 /
#                           gpt-4.1 / gpt-5 (matched on YOUR model id / alias).
#                           Non-OpenAI models keep the heuristic. The response
#                           envelope still carries the heuristic estimate (the
#                           request is never delayed); the accurate count is
#                           computed AFTER the response by a background task
#                           (BPE on the blocking pool, spawn_blocking) and
#                           lands in Prometheus and usage_log - the accounting
#                           surfaces. Only fires when an upstream omitted
#                           usage. Encoders are built once at startup.
#                           Streaming input counts remain heuristic (the
#                           stream is not buffered).
# ---------------------------------------------------------------------------
[tokenizer]
mode = "heuristic"                # "heuristic" (default) or "accurate"

# ---------------------------------------------------------------------------
# Resilience: retries, fallbacks, circuit breaker, timeouts, health checks.
#
# Every value below is the built-in default - the whole section is optional.
# Retries and the circuit breaker are always active with these defaults; only
# fallback between models (a `[[virtual_models]]` entry, see the end of this
# file) and background health checks are opt-in. None of this ever touches the DB on the request path, and
# an upstream 429 storm can never destabilise the gateway itself.
# ---------------------------------------------------------------------------
[resilience]
# Retries - applied ONLY to retryable upstream failures (5xx, connect/read
# timeout, 429). A client 4xx is NEVER retried (a fallback would reject it too).
# Backoff is exponential with equal jitter, and honours an upstream
# `Retry-After` as a floor. While streaming, a retry happens only if no chunk
# has yet reached the client.
retry_max_attempts = 3            # total attempts per provider incl. the first
                                  # (set to 1 to disable retries); must not be 0
retry_base_ms = 200               # base backoff wait after the first failure
retry_max_ms = 5000               # ceiling on the exponential backoff term

# Circuit breaker - per (provider, model). After N consecutive provider-fault
# failures the circuit opens; while open the model is skipped straight to the
# next target of the virtual model that routed to it (trigger `circuit_open`),
# or answered with 503 LM-3020 (+ Retry-After) when none remains.
# After the cooldown, a single half-open probe decides whether to close again.
# State is exported as lumen_circuit_state{provider,model}
# (0 = closed, 1 = open, 2 = half-open).
circuit_failure_threshold = 5     # consecutive failures that trip it open
circuit_cooldown_ms = 30000       # time spent open before a half-open probe

# Timeouts. `connect` here is the default for the shared, pooled HTTP client.
# The first-token timeout lives in [server] (server.first_token_timeout_ms); the
# total timeout is here. ALL THREE (connect, first-token, total) can be
# overridden per provider (see the ollama-local block below). Overriding a
# provider's connect timeout gives it its OWN HTTP client, so it no longer
# shares the pool (ADR 005, 2026-07-15 amendment); the other two overrides do
# not. Each timeout maps to a distinct 504 for debugging: LM-3012 connect,
# LM-3011 first-token, LM-3013 total (the whole request - all retries and
# every virtual-model fallback together).
connect_timeout_ms = 5000         # TCP + TLS connection establishment
total_timeout_ms = 600000         # absolute per-request deadline (10 minutes)

# Background health checks (OFF by default). When enabled, a periodic task
# probes every provider that has a configured `base_url` (self-hosted TEI /
# Ollama / vLLM, or any explicit override) and publishes the result at
# GET /health/providers and on lumen_provider_up{provider}. Self-hosted kinds
# get a real liveness endpoint (TEI and vLLM: server-root /health; Ollama:
# /api/version) where a non-2xx means down; other kinds get a bare
# reachability GET on base_url. Providers on a built-in vendor URL report
# `unknown` (never probed - the gateway hardcodes no vendor endpoints). The
# gateway's own /health stays independent of provider health and does no I/O.
health_check_enabled = false
health_check_interval_ms = 30000  # probe cadence (must not be 0 when enabled)

# ---------------------------------------------------------------------------
# Providers
#
# Each `[[providers]]` block declares one upstream. `kind` selects the built-in
# implementation - one of the native integrations (openai | anthropic | google |
# azure | vertex_ai | bedrock | mistral | cohere | jina | voyage | mixedbread |
# pinecone | nvidia | tei | ollama | typesafe) or one of the OpenAI-compatible
# hosts (groq | together | fireworks | deepseek | openrouter | perplexity | xai |
# deepinfra | huggingface | cloudflare | vllm). See docs/providers.md for the
# full matrix.
# `name` is your own label and must be unique.
#
# Each `[[providers.models]]` block declares a FOUNDATION model: one upstream
# model on this provider, callable directly by its id.
#   id            the id clients send (owned entirely by you)
#   upstream_id   what LUMEN sends upstream (defaults to `id`)
#   capabilities  any of: "chat", "embed", "rerank", "systemone" (a typesafe
#                 model serves "systemone" only; Jev reranks through a virtual
#                 model `remap`, see below)
#   modalities    input modalities; defaults to ["text"]. Add "image" to accept
#                 image content parts on chat (vision) and /v1/embeddings (M9).
#                 Image input to a model without "image" is rejected with
#                 LM-2003.
#   cost_per_1m_input / cost_per_1m_output / cost_per_1k_searches
#                 optional prices (USD), the source of cost counting and hard
#                 budgets
#   release_date  optional ISO date the model was released, quoted
#                 ("2024-08-06") or as a bare TOML date (2024-08-06).
#                 GET /v1/models returns it as `release_date` and as the
#                 OpenAI integer `created` (midnight UTC), so clients can sort
#                 models by release. Metadata only, never used for routing.
# Model ids must be unique across ALL providers (a collision aborts startup and
# names both offending providers). Several ids MAY map to the same upstream_id.
#
# Fallback chains, weighted splits, conditional routing, chat presets and Jev
# reranking are NOT declared here: they are virtual models, in the
# `[[virtual_models]]` section at the end of this file (ADR 014). A config
# written for an older LUMEN (per-model fallbacks, a per-model Jev rerank
# block, or `rerank` on a typesafe model) fails validation; run
# `lumen config migrate` (add --dry-run to preview) to convert it.
# ---------------------------------------------------------------------------

# OpenAI: chat + embeddings.
[[providers]]
name = "openai"
kind = "openai"
api_key_env = "OPENAI_API_KEY"
# base_url = "https://api.openai.com/v1"   # optional override

# Clients call `gpt-4o`, the virtual model at the end of this file that falls
# back to Claude. This foundation id stays callable directly, for a request
# that must be served by OpenAI or fail.
[[providers.models]]
id = "openai/gpt-4o"
upstream_id = "gpt-4o-2024-08-06"
capabilities = ["chat"]
# Input modalities this model accepts. Default is ["text"]; opt a model into
# vision (image_url content parts in /v1/chat/completions) by adding "image".
# An image part sent to a model without it is rejected with LM-2003 (400)
# before any upstream call. See docs/providers.md#vision-image-input.
# modalities = ["text", "image"]
# When the model was released (ISO "YYYY-MM-DD", validated at boot). Surfaced
# on GET /v1/models as `release_date` + `created` for sorting by release.
release_date = "2024-08-06"
# Optional prices (USD) - the source of cost counting and hard budgets.
# A model without prices costs 0: budgets then never bite on it.
cost_per_1m_input = 2.5
cost_per_1m_output = 10.0

[[providers.models]]
id = "text-embedding-3-small"
capabilities = ["embed"]

# Anthropic: chat (bidirectional OpenAI <-> Anthropic translation). The second
# target of the `gpt-4o` virtual model below: the same capability from a
# different vendor, so a single-vendor outage doesn't take chat down.
[[providers]]
name = "anthropic"
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[[providers.models]]
id = "claude-sonnet-4-5"
upstream_id = "claude-sonnet-4-5-20250929"
capabilities = ["chat"]
cost_per_1m_input = 3.0
cost_per_1m_output = 15.0

# Google Gemini (public Gemini Developer API): chat + embeddings. The key
# rides the `x-goog-api-key` header, never the URL. Embeddings go through
# `batchEmbedContents` (up to 100 inputs per upstream call; larger requests
# are split by the gateway).
# [[providers]]
# name = "google"
# kind = "google"
# api_key_env = "GEMINI_API_KEY"
#
# [[providers.models]]
# id = "gemini-2.0-flash"
# capabilities = ["chat"]
#
# [[providers.models]]
# id = "gemini-embedding-001"
# capabilities = ["embed"]

# Google Vertex AI: chat + embeddings (Gemini models on GCP). Distinct from
# kind = "google" (the public Gemini Developer API): Vertex uses regional
# endpoints and GCP service-account OAuth. `api_key_env` names a var holding
# the FULL service-account key JSON (the key file contents, not a path):
#   export VERTEX_SA_JSON="$(cat service-account.json)"
# `base_url` carries the GCP region; the project id comes from the JSON. LUMEN
# exchanges an RS256-signed JWT for a short-lived access token and caches it in
# memory (refreshed 60 s before expiry) - the key is never logged. Embeddings
# use the `:predict` endpoint, one input per upstream call (the gateway fans
# batches out concurrently; gemini-embedding-001 takes a single instance per
# request).
# [[providers]]
# name = "vertex"
# kind = "vertex_ai"
# api_key_env = "VERTEX_SA_JSON"
# base_url = "us-central1"
#
# [[providers.models]]
# id = "gemini-flash-vertex"
# upstream_id = "gemini-2.0-flash"
# capabilities = ["chat"]
#
# [[providers.models]]
# id = "gemini-embedding-vertex"
# upstream_id = "gemini-embedding-001"
# capabilities = ["embed"]

# AWS Bedrock: chat via the Converse API (one uniform schema across the
# Anthropic / Meta / Amazon / Mistral model families). Auth is AWS SigV4, NOT a
# bearer key: credentials come from the standard AWS environment variables
# (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and optionally
# `AWS_SESSION_TOKEN`), re-read on every request, so `api_key_env` is not
# required. Set `base_url` to the runtime endpoint for your region; the region
# is parsed back out of it for the signing scope (standard and VPC endpoint
# hosts). For any other custom endpoint export AWS_REGION - a provider whose
# region cannot be determined fails at startup. `upstream_id` is the Bedrock
# model id and may include a version suffix with a colon; current Claude
# models are invoked through a region-prefixed inference profile id
# (`us.` / `eu.` / `apac.` + model id).
[[providers]]
name = "bedrock"
kind = "bedrock"
base_url = "https://bedrock-runtime.us-east-1.amazonaws.com"
# api_key_env = "AWS_SECRET_ACCESS_KEY"   # optional: overrides the env secret

[[providers.models]]
id = "bedrock-claude-sonnet-4-5"
upstream_id = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
capabilities = ["chat"]
modalities = ["text", "image"]

# Ollama: local, keyless. Requires a base_url - the server ROOT, no /v1.
# Embeddings use the native /api/embed; chat goes through Ollama's
# OpenAI-compatible endpoint (the gateway appends the /v1 itself).
[[providers]]
name = "ollama-local"
kind = "ollama"
base_url = "http://localhost:11434"
# Per-provider timeout overrides (optional). A local model can take a while to
# load into VRAM on its first call, so relax the first-token and total windows
# for THIS provider only; they fall back to [server].first_token_timeout_ms and
# [resilience].total_timeout_ms when unset. `connect_timeout_ms` may also be
# overridden here: a self-hosted box on a slow link can be given a looser connect
# deadline than the global default. NOTE: setting connect_timeout_ms gives this
# provider its OWN (unpooled) HTTP client (ADR 005, 2026-07-15 amendment); leave
# it unset to keep sharing the pooled client. All apply to every model this
# provider serves.
first_token_timeout_ms = 60000
total_timeout_ms = 120000
# strict = false   # optional (default false). When true, reject a request that
                   # sets an unsupported-but-meaningful field this provider
                   # cannot honor with a 400 (LM-1001) instead of silently
                   # dropping it. Ollama: `dimensions`. Translated chat kinds
                   # (anthropic, google, vertex_ai, bedrock, cohere):
                   # response_format / seed / logprobs / top_logprobs /
                   # logit_bias / parallel_tool_calls
                   # where no native mapping exists (docs/providers.md, "OpenAI
                   # chat extras on translated providers"). `encoding_format` is
                   # always handled at the response edge and is never affected.
connect_timeout_ms = 10000        # own client: relaxed connect for a slow local link

[[providers.models]]
id = "local-llama"
upstream_id = "llama3.2"
capabilities = ["chat"]

[[providers.models]]
id = "nomic-embed"
upstream_id = "nomic-embed-text"
capabilities = ["embed"]

# Cohere: embeddings + reranking. A single model can serve BOTH capabilities.
[[providers]]
name = "cohere"
kind = "cohere"
api_key_env = "COHERE_API_KEY"

# Clients call `rerank-english`, the virtual model below that falls back from
# Cohere to Jina, then Voyage.
[[providers.models]]
id = "cohere/rerank-english"
upstream_id = "rerank-v3.5"
capabilities = ["rerank"]
# Rerank is billed in search units (1 unit ≈ one query over ≤ 100 documents).
cost_per_1k_searches = 2.0

# Versioned aliasing: a stable public id pinned to a specific upstream version.
# Bump `upstream_id` to roll the model forward without changing client code.
[[providers.models]]
id = "embed-multilingual"
upstream_id = "embed-v4.0"
capabilities = ["embed", "rerank"]
# embed-v4 is multimodal: declare "image" so /v1/embeddings accepts image
# content parts. With [image_fetch] enabled, remote image URLs are fetched and
# inlined; otherwise clients must pass a data: URI.
modalities = ["text", "image"]

# Jina: embeddings + reranking (hosted).
[[providers]]
name = "jina"
kind = "jina"
api_key_env = "JINA_API_KEY"

[[providers.models]]
id = "jina-rerank"
upstream_id = "jina-reranker-v2-base-multilingual"
capabilities = ["rerank"]

# Voyage: embeddings + reranking (hosted).
[[providers]]
name = "voyage"
kind = "voyage"
api_key_env = "VOYAGE_API_KEY"

[[providers.models]]
id = "voyage-rerank"
upstream_id = "rerank-2"
capabilities = ["rerank"]

# Mixedbread: reranking (hosted, mxbai-rerank-*). Bearer auth. The endpoint is
# POST /v1/reranking (`input`/`top_k` on the wire); the gateway translates.
[[providers]]
name = "mixedbread"
kind = "mixedbread"
api_key_env = "MXBAI_API_KEY"

[[providers.models]]
id = "mxbai-rerank"
upstream_id = "mixedbread-ai/mxbai-rerank-large-v1"
capabilities = ["rerank"]

# Pinecone: hosted reranking. Auth is the `Api-Key` header (not a bearer token).
# Pinecone reports real usage (rerank_units), carried through as search_units.
[[providers]]
name = "pinecone"
kind = "pinecone"
api_key_env = "PINECONE_API_KEY"

[[providers.models]]
id = "pinecone-rerank"
upstream_id = "pinecone-rerank-v0"
capabilities = ["rerank"]

# TypeSafe: SystemOne typed decisions (Jev), served on POST /v1/systemone
# (ADR 013, docs/systemone/systemone.md). Bearer auth; api_key_env is required.
# base_url defaults to https://api.typesafe.ai (a trailing /v1 is tolerated).
# The TypeSafe SDKs work unchanged with TYPESAFE_BASE_URL set to this gateway.
[[providers]]
name = "typesafe"
kind = "typesafe"
api_key_env = "TYPESAFE_API_KEY"
# base_url = "https://api.typesafe.ai"   # optional override

[[providers.models]]
id = "jev"
upstream_id = "jev-latest"   # stable alias; also jev-preview, or a version
capabilities = ["systemone"]
# Jev bills input tokens only: no cost_per_1m_output needed.
cost_per_1m_input = 0.042

# A pinned version for reproducible answers. Clients call `jev-1.13.0`, the
# virtual model below that falls back to the stable alias `jev`.
[[providers.models]]
id = "typesafe/jev-1.13.0"
upstream_id = "jev-1.13.0"
capabilities = ["systemone"]
cost_per_1m_input = 0.042

# NVIDIA NIM: reranking via `{base}/v1/ranking`. base_url REQUIRED (the NIM
# root); keyless for self-hosted NIMs (set api_key_env for the hosted API).
# Scores are raw logits (unbounded, comparable only within one response).
[[providers]]
name = "nvidia-nim"
kind = "nvidia"
base_url = "http://localhost:8000"
# api_key_env = "NVIDIA_API_KEY"

[[providers.models]]
id = "nvidia-rerank"
upstream_id = "nvidia/llama-3.2-nv-rerankqa-1b-v2"
capabilities = ["rerank"]

# Together: one entry serves chat + embed (OpenAI-compatible) AND native rerank
# (LlamaRank, Cohere-shaped `/rerank`). Bearer auth, default base URL.
[[providers]]
name = "together"
kind = "together"
api_key_env = "TOGETHER_API_KEY"

[[providers.models]]
id = "llama-rank"
upstream_id = "Salesforce/Llama-Rank-V1"
capabilities = ["rerank"]

# TEI (Text Embeddings Inference): self-hosted, keyless. Requires a base_url.
# Serves one model per process; `upstream_id` is ignored by TEI but kept for
# your own clarity.
[[providers]]
name = "tei-local"
kind = "tei"
base_url = "http://localhost:8081"

[[providers.models]]
id = "bge-reranker"
upstream_id = "BAAI/bge-reranker-large"
capabilities = ["rerank"]

# Azure OpenAI: chat + embeddings, reusing the OpenAI JSON schema. Auth is the
# `api-key` header (never a bearer token); routing is by URL path
# (/openai/deployments/{deployment}/...), not the `model` field, so each
# model's `upstream_id` below must be the Azure DEPLOYMENT NAME, not an
# OpenAI model id. `base_url` is required (every Azure resource endpoint is
# operator-specific). The Azure API version is selected by the optional
# `api_version` field below; for back-compat, `base_url` may instead carry an
# `?api-version=YYYY-MM-DD` query string. Precedence: the `api_version` field
# wins over the `base_url` query string, which wins over a pinned built-in
# default (see `crates/providers/src/azure`). `api_version` is azure-only:
# setting it on any other kind is a boot-time config error.
[[providers]]
name = "azure-openai"
kind = "azure"
api_key_env = "AZURE_OPENAI_API_KEY"
base_url = "https://my-resource.openai.azure.com"
api_version = "2024-10-21"

[[providers.models]]
id = "azure-gpt-4o"
upstream_id = "my-gpt4o-deployment"   # the Azure deployment name
capabilities = ["chat"]

# ---------------------------------------------------------------------------
# Virtual models (ADR 014)
#
# A virtual model is an id clients send that LUMEN resolves, per request, to
# one or more foundation models (declared above) or other virtual models. It
# lives in the dynamic config: it hot-reloads, and is editable through
# /admin/config and /admin/config/virtual_models (ADR 012). Foundation
# and virtual ids share ONE namespace: a collision is a validation error. Ids
# are non-empty and use only the characters A-Z a-z 0-9 . _ : / -
# (`company/model` is a convention, not a rule).
#
# Fields of a `[[virtual_models]]` entry:
#   id           the id clients send, e.g. "acme/legal-rerank" (required)
#   capability   exactly one of "chat", "embed", "rerank", "systemone"
#                (required); define two ids to serve two capabilities
#   strategy     how `targets` are used (required):
#                  "single"   the one target (exactly 1 target)
#                  "fallback" targets in order, moving to the next when the
#                             failure matches `fallback_on` (2 or more)
#                  "split"    one target picked at random by `weight`; on a
#                             matching failure, the others in descending
#                             weight order (2 or more)
#                  "switch"   the first target whose `when` matches; a chosen
#                             branch never falls through to the next rule
#   targets      ordered array of target tables (required), each with:
#                  model      a foundation or virtual id (required)
#                  weight     integer > 0, required on "split" and only there
#                  when       condition, "switch" only: every target but the
#                             last has one, the last (the default) has none
#                  overrides  request field overrides:
#                             { set = {...}, default = {...}, drop = [...] }.
#                             `set` always applies, `default` only when the
#                             client did not send the field, `drop` removes
#                             it. Allowed fields: chat temperature, top_p,
#                             max_tokens, max_completion_tokens, stop, seed,
#                             presence_penalty, frequency_penalty,
#                             response_format, reasoning_effort,
#                             parallel_tool_calls; embed dimensions,
#                             encoding_format; rerank top_n; systemone none.
#                             The level closest to the foundation leaf wins.
#                  remap      rerank virtual models only, on a target that
#                             points directly at a foundation model serving
#                             "systemone": converts /v1/rerank into Jev
#                             SystemOne calls. `strategy` is "noul" (default:
#                             `instructions`, `criteria.true`,
#                             `criteria.false`), "score" (`instructions`,
#                             `levels`, worst first), "composite" (1 to 8
#                             `questions`, each with `instructions`,
#                             `criteria`, `weight`) or "choice"
#                             (`instructions`; the documents are the options,
#                             at most 255 in one call). An optional `context`
#                             is sent in the SystemOne state. Cost is the
#                             SystemOne model's cost_per_1m_input.
#   fallback_on  "fallback" and "split" only. Triggers that move to the next
#                target. Default:
#                ["provider_error", "rate_limited", "timeout", "circuit_open"]
#                  provider_error  retryable upstream 5xx (including a
#                                  TypeSafe 529 overload), unreachable
#                                  upstream, stream end before the first
#                                  byte. A malformed response (LM-3002) and
#                                  non-retryable statuses never fail over
#                  rate_limited    upstream 429
#                  timeout         connect, first-token or attempt timeout
#                  circuit_open    the leaf's circuit breaker is open
#                  context_length  opt-in: input rejected as too long
#                  content_filter  opt-in: refused on content policy
#                A client 4xx, a client cancellation, or a failure after the
#                first streamed byte never fails over. Retries happen inside
#                each leaf first; [resilience].total_timeout_ms bounds the
#                whole tree (LM-3013).
#   preset       "chat" only: { system_prompt = "...", system_prompt_mode =
#                "prepend" | "replace" | "if_absent", overrides = {...} }.
#                Applies only when this virtual model is the requested id; the
#                prompt (at most 32 KiB) counts in tokens and cost, and is
#                never logged.
#   description  optional, shown on GET /v1/models
#   listed       default true; false hides the model from GET /v1/models (it
#                stays callable)
#
# `when` attributes: group (the key's budget group), "metadata.<key>" (a
# top-level field of the x-lumen-metadata header; quote the key in TOML),
# has_images, has_tools, stream, input_tokens, documents. A bare value means
# equality; operators are in, ne, gt, gte, lt, lte, regex. Several keys in one
# table are ANDed; `any = [{...}, {...}]` is an OR. A missing attribute is
# false.
#
# Nesting is allowed up to 8 levels, without cycles. The response reports the
# foundation model that served the request in x-lumen-model-used, and the path
# taken in x-lumen-route; usage_log records both (`model_used`, `route`).
#
# Inline tables `{ ... }` must stay on ONE line (TOML 1.0): for long targets,
# use `[[virtual_models.targets]]` sub-tables, as `acme/legal-rerank` does.
# ---------------------------------------------------------------------------

# Fallback: `gpt-4o` is served by OpenAI, and by Claude when OpenAI fails
# with a default trigger (5xx, 429, timeout, open circuit).
[[virtual_models]]
id = "gpt-4o"
capability = "chat"
strategy = "fallback"
targets = [{ model = "openai/gpt-4o" }, { model = "claude-sonnet-4-5" }]

# A multi-hop fallback across three rerank vendors: if Cohere is down, try
# Jina, then Voyage, so a rerank request survives any single vendor outage.
[[virtual_models]]
id = "rerank-english"
capability = "rerank"
strategy = "fallback"
targets = [{ model = "cohere/rerank-english" }, { model = "jina-rerank" }, { model = "voyage-rerank" }]

# The pinned Jev version, falling back to the stable alias when it is
# overloaded (TypeSafe 529, the `provider_error` trigger) or its circuit is
# open.
[[virtual_models]]
id = "jev-1.13.0"
capability = "systemone"
strategy = "fallback"
targets = [{ model = "typesafe/jev-1.13.0" }, { model = "jev" }]

# Jev as a reranker: POST /v1/rerank on `jev-rerank` is converted to SystemOne
# calls on `jev` whose state is the query and whose questions are one noul per
# document; the noul is the relevance_score. Every remap field is optional
# (the defaults are a generic relevance question).
[[virtual_models]]
id = "jev-rerank"
capability = "rerank"
strategy = "single"
description = "Jev relevance reranking"

[[virtual_models.targets]]
model = "jev"
[virtual_models.targets.remap]
strategy = "noul"
instructions = "Is `document` relevant to the query in the state, that is, does it answer the query or contain information that directly helps answer it?"
criteria.true = "The document answers the query or contains information that directly helps answer it."
criteria.false = "The document is off-topic, or only shares keywords with the query without helping answer it."

# Preset: a support bot with its own system prompt and sampling defaults,
# falling back from GPT-4o to Claude. `gpt-4o` here is itself a virtual model,
# so this nests two levels.
[[virtual_models]]
id = "acme/support-bot"
capability = "chat"
strategy = "fallback"
targets = [{ model = "gpt-4o" }, { model = "claude-sonnet-4-5" }]
description = "Acme support assistant"
preset = { system_prompt = "You are Acme's support assistant. Answer briefly and point to the documentation when relevant.", system_prompt_mode = "prepend", overrides = { default = { temperature = 0.2 }, set = { max_tokens = 800 } } }

# Composite remap with a vendor fallback: two weighted Jev questions per
# document, then Cohere when Jev fails.
[[virtual_models]]
id = "acme/legal-rerank"
capability = "rerank"
strategy = "fallback"

[[virtual_models.targets]]
model = "jev"
[virtual_models.targets.remap]
strategy = "composite"
context = "US federal case law. Prefer holdings over dicta."
[[virtual_models.targets.remap.questions]]
instructions = "Is `document` on the topic of the query?"
weight = 0.3
criteria.true = "It discusses the same legal question."
criteria.false = "It is about something else."
[[virtual_models.targets.remap.questions]]
instructions = "Does `document` state the rule the query cites?"
weight = 0.7
criteria.true = "It states the specific rule."
criteria.false = "It only mentions related topics."

[[virtual_models.targets]]
model = "rerank-english"

# Split: 80% of `acme/chat-ab` goes to OpenAI and 20% to Azure OpenAI; a
# failing pick moves to the other one. Uncomment to enable.
# [[virtual_models]]
# id = "acme/chat-ab"
# capability = "chat"
# strategy = "split"
# targets = [{ model = "openai/gpt-4o", weight = 80 }, { model = "azure-gpt-4o", weight = 20 }]

# Switch: route by budget group (matches only with auth enabled), by request
# metadata and by request shape. Needs the `acme/chat-eu` and `gemini-long`
# models, which this file does not declare. The last target is the mandatory
# default.
# [[virtual_models]]
# id = "acme/chat"
# capability = "chat"
# strategy = "switch"
# targets = [
#   { when = { group = "eu-customers" }, model = "acme/chat-eu" },
#   { when = { "metadata.plan" = { in = ["pro"] }, input_tokens = { gt = 32000 } }, model = "gemini-long" },
#   { when = { any = [{ has_images = true }, { has_tools = true }] }, model = "gpt-4o" },
#   { model = "local-llama" },
# ]

# ---------------------------------------------------------------------------
# Multimodal image fetching (M9) - OFF by default.
#
# When enabled, a remote http(s) image URL in a /v1/embeddings content-parts
# request is fetched server-side, base64-encoded, and inlined as a data: URI
# before being sent to the provider. Disabled → such a URL is rejected with
# LM-2005 (clients must pass a data: URI themselves).
#
# Guards (always on when enabled): the private/loopback/link-local IP block is
# non-configurable; the connection is pinned to the vetted resolved address
# (DNS-rebinding safe); downloads are capped and time-bounded; only image/*
# content types are accepted. Restrict `allowed_hosts` / `allowed_url_prefixes`
# to your own asset origins in production - leaving both empty with fetching on
# logs a startup warning.
# ---------------------------------------------------------------------------
[image_fetch]
enabled = false
max_bytes = 10485760          # 10 MiB per image
timeout_ms = 5000             # per-fetch timeout
allowed_schemes = ["https"]   # add "http" to allow plaintext
allowed_hosts = []            # e.g. ["cdn.example.com", ".mycompany.com"]; empty = any public host
allowed_url_prefixes = []     # e.g. ["https://cdn.example.com/images/"]; empty = no prefix restriction
