      responses:
        "200": { description: Status and settings (never the signing secret)., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace the webhook settings (stored; wins over the config block)
      operationId: putWebhooks
      security: [{ masterKey: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/WebhookSettings" } }
