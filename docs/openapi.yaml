        "200": { description: The settings in force., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Stop emitting events, persistently (idempotent; the config block does not re-enable them)
      operationId: deleteWebhooks
      security: [{ masterKey: [] }]
      responses:
        "200": { description: The resulting status., content: { application/json: { schema: { $ref: "#/components/schemas/WebhookStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
